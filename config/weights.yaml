# ==============================================================
# 短线选股权重配置（可热调，无需改代码）
#
# 当前执行口径：
# - run-once 实际运行 7 个短线维度：
#   limit / limit_restart / moneyflow / lhb / sector / theme / exhaustion。
# - exhaustion 是 v2.6 新增的短期动量质量检测维度，替代原 sentiment 预留位。
# - 所有维度均会出分，固定分母 = 1.00，纯规则 rule_score 理论上限 100。
# dimension_weights 总和保持 1.00，便于 rule_score 与 AI 分处在稳定的 0-100 量纲。
# ==============================================================

# 7 个权重项；全部已实现。
dimension_weights:
  limit: 0.18       # 异动涨停（当日涨停质量 + T-1 断板反包）
  limit_restart: 0.15  # 历史涨停后回调重启（T-2~T-5）
  moneyflow: 0.22   # 主力资金流向
  lhb: 0.15         # 龙虎榜（base 60 + seat 40）
  sector: 0.10      # 申万二级行业 + 行业内领涨确认
  theme: 0.10       # 同花顺概念 + 涨停最强 + 资金流（v2.1 新增独立维度）
  exhaustion: 0.10  # 短期动量质量检测（v2.6 替代 sentiment 预留位）

# 规则分 vs AI 分 的融合权重。
# enable_ai=false、swing 自动跳过 AI、或 Claude 调用失败时，final_score 直接等于 rule_score；
# 只有 ai_score 有值时才按 rule_weight / ai_weight 做加权平均。
combine:
  rule_weight: 0.6
  ai_weight: 0.4
  # v2.3：板块多样化 cap —— 最终 Top N 中同一申万一级板块最多入选数。
  # 0 或负值 = 禁用 cap（行为同 v2.2，纯按 final_score 取 TOP N）。
  # 默认 4：Top 20 时强制至少 5 个板块；防止 1 个板块全员霸榜。
  max_stocks_per_sector: 4
  # 无 index_member 映射的股票最多入选数（兜底）。当板块同步失败、全市场都
  # 变成 unknown 时，避免 cap 静默失效。0 = 不限（默认）。
  max_unknown_sector_stocks: 0

# 硬规则：触发任一则直接淘汰（不入 selection_result.picked）
hard_reject:
  # 标的黑名单关键词（匹配股票名称或最近公告标题）
  negative_announcement_keywords:
    - "立案调查"
    - "实际控制人变更"
    - "商誉减值"
    - "财务造假"
    - "暂停上市"
    - "退市风险警示"
  # 仅作板块信号，不推荐次日追高
  exclude_today_limit_up: true
  # 跌停股不推荐（避免"机构抄底"误判，跟 limit_up 对称）
  exclude_today_limit_down: true
  # 当日停牌（amount=0 / NULL）排除（v2 新增）
  exclude_suspended: true
  # 次新过滤：上市不满 N 日
  min_list_days: 60
  # ST / *ST 直接排除
  exclude_st: true
  # 极端短期透支硬淘汰（v2.6）
  # 5 日累计涨幅超过此阈值直接淘汰（与 exhaustion_filter 梯度惩罚互补）
  # 25%：约 2.5 个涨停，连板股在此阈值以上风险显著升高
  max_5d_return_pct: 25
  # 5 日涨幅 > 20% 且连涨 ≥ 此天数直接淘汰
  max_consecutive_up_with_5d_return:
    ret_5d_pct: 20
    min_consecutive_days: 5

# 涨停维度细则
limit_filter:
  first_board_bonus: 20    # 首板加分
  second_board_bonus: 30   # 连板首日（2 连板）
  open_times_penalty: 10   # 每次开板扣分
  seal_amount_tier:        # 封单额分档加分（亿元）
    - threshold: 1.0
      score: 10
    - threshold: 5.0
      score: 20
    - threshold: 10.0
      score: 30

# 涨停回调重启维度细则
# 职责：最近一次涨停在 T-2~T-5，今日未涨停，识别缩量回调后的重启信号。
# 当前阈值为先验值，需通过短线回测继续校准。
limit_restart_filter:
  lookback_min_days: 2
  lookback_max_days: 5
  abnormal_limit_volume_ratio: 3.0
  min_prev20_volume_days: 10
  multi_limit_penalty_per_extra: 15
  min_restart_score: 15  # 最小重启信号分：需至少命中一个核心项（收阳/重心上移/低开高走/量能恢复）

# 资金流维度细则（满分 100：today 0-50 + ratio 0-30 + rolling 0-20）
moneyflow_filter:
  rolling_3d_bonus: 20            # 近 3 日累计为正再加（上限 0-20）
  rolling_3d_outflow_penalty: 15  # 近 3 日累计净流出时扣分
  big_order_ratio_threshold: 0.4  # 大单+超大单净流入占比阈值（上限 0-30）
  small_up_big_down_penalty: 30   # 小单流入大单流出惩罚
  double_penalty_for_multi_board_rebound: true  # 二连板+断板出货信号加倍惩罚（30→60）
  # 价格确认规则写在代码中：正净流入必须满足 daily_kline.close > daily_kline.open。
  # 日内收阴的正净流入常是承接卖盘，不作为主动建仓信号。
  # today_bonus 连续公式在 _today_bonus_tier 代码中：ratio<0.3%→0, 0.3%~5%→线性5~50, ≥5%→50

# 龙虎榜维度细则（v2.1 重排：base 60 + seat 40）
lhb_filter:
  base_score: 20              # 上榜 + 净买入基础分
  # base 子项的分档值现在硬编码在 lhb_filter._net_rate_tier_bonus / _purity_bonus / _reason_bonus
  # （tier 0-20 / purity 0-12 / reason 0-8），如需调改函数即可。
  # seat 部分（上限 40 / 下限 -15）
  institution:
    min_net_buy_yuan: 10000000
    bonus: 20
  hot_money_buy:
    min_net_buy_yuan: 5000000
    bonus: 12
  hot_money_sell:
    min_net_sell_yuan: 10000000
    penalty: 15
  northbound_buy:
    min_net_buy_yuan: 30000000
    bonus: 8

# 板块维度细则
# 数据源：sw_daily（板块涨幅）+ index_member（股票→行业映射）+ daily_kline（个股领涨判断）
# 打分流程：L2 TOP N 行业 → 行业内领涨过滤 → rank_bonus + trend_bonus → leadership_factor 乘 → 归一化 0-100
# rank_bonus 分档表在代码 _rank_to_bonus 中：{1:50, 2:40, 3:35, 4:28, 5:22, 7:14, 10:8}
sector_filter:
  top_n_l2: 10        # 申万二级行业当日涨幅 TOP N（~100 个 L2 行业取前 10，覆盖率 ~10%）
  min_l2_size_for_leadership: 5  # 成分股 <5 的 L2 行业跳过领涨判断，直接给 leadership_factor=1.0

# 题材维度细则
# 数据源：ths_daily（概念涨幅）+ limit_concept_daily（涨停最强）+ ths_concept_moneyflow（资金流）
# 打分流程：涨幅/涨停折扣叠加 + 资金流排名分位 + 时间确认 → 跨概念取 max → clamp 0-100
theme_filter:
  top_n_themes: 10    # ths_daily 概念涨幅取 TOP N
  signal_discount: 0.3  # 涨幅排名和涨停排名折扣叠加系数：max(rb, lb) + 0.3 × min(rb, lb)

  # 同花顺概念涨幅排名 → 加分（找 ≥ rank 的最小 key，保守策略）
  ths_rank_bonus:
    1: 50
    2: 42
    3: 35
    4: 28
    5: 22
    7: 14    # rank 6-7
    10: 8    # rank 8-10

  # 涨停最强概念排名 → 加分（数据源：limit_concept_daily.rank）
  limit_concept_rank_bonus:
    1: 50
    3: 35
    5: 22
    7: 12    # rank 6-7
    10: 6    # rank 8-10

  # 概念资金流排名分位打分（数据源：ths_concept_moneyflow.net_amount，单位亿元）
  # 正向需 net_amount > 0 门槛（防止全市场净流出时给"流出最少"的概念错误加分）
  # 负向需 net_amount < 0 门槛（只有真正净流出才扣分）
  concept_moneyflow:
    inflow_positive_rank_top_5:
      score: 20   # 净流入排名前 5
    inflow_positive_rank_top_10:
      score: 12   # 净流入排名前 10
    inflow_positive_rank_top_20:
      score: 5    # 净流入排名前 20
    outflow_negative_rank_bot_5:
      score: -15  # 净流出排名倒数前 5
    outflow_negative_rank_bot_10:
      score: -8   # 净流出排名倒数前 10

  # 短线轻量时间确认（克制设计，不做大权重持续性加成，避免与 swing ThemeSwingFilter 职责重叠）
  concept_temporal_bonus:
    yesterday_in_top_n: 5   # 概念昨日也在 ths_daily TOP 10 → +5
    rank_improvement: 5     # 今日排名较昨日上升 → +5

  max_theme_bonus: 100  # 信号合成上限

# 短期动量质量维度细则（v2.6 新增，替代 sentiment 预留位）
# 打分逻辑：100 - Σ(各项惩罚) → clamp 0-100，即"新鲜度"分。
# 100 = 动量健康，0 = 动量极差。
exhaustion_filter:
  # 5 日累计涨幅惩罚（主信号）
  # 短线追势策略中，5 日涨幅高 ≠ 风险，强势股天然涨幅高。
  # 设为 0 关闭此惩罚，极端透支由 hard_reject 层处理。
  penalty_5d_return_max: 0

  # MA5 偏离度惩罚（均线回归压力）
  # 同理，强势股天然偏离 MA5。设为 0 关闭。
  penalty_ma5_deviation_max: 0

  # 冲高回落惩罚（长上影 + 收盘弱 + 近期上涨 + 当天冲高）
  penalty_upper_shadow_max: 15
  threshold_upper_shadow_ratio: 0.6       # 上影线/振幅 > 此值
  threshold_close_position: 0.5           # 收盘位置 < 此值（全日下半区）
  threshold_upper_shadow_3d_return: 5.0   # 近 3 日涨幅 > 此值才检查
  threshold_high_return_from_pre_close: 3.0  # high 相对昨收涨幅 >= 此值才检查

  # 量价背离惩罚
  penalty_volume_divergence_max: 20
  threshold_shrink_vol_ratio: 0.6    # 缩量上涨：今日量 < 均量×此值
  threshold_shrink_3d_return: 5.0    # 缩量上涨：近 3 日涨幅 > 此值
  threshold_blowoff_vol_ratio: 2.0   # 放量滞涨：今日量 > 均量×此值
  threshold_blowoff_pct_chg: 2.0     # 放量滞涨：相对昨收涨幅 < 此值

  # 连涨天数惩罚（收阳线连续天数）
  # low~mid 轻罚 ratio_low；mid~high 中罚 ratio_mid；≥high 满罚
  penalty_consecutive_up_max: 10
  threshold_consecutive_up_low: 3
  threshold_consecutive_up_mid: 5
  threshold_consecutive_up_high: 7
  ratio_consecutive_up_low: 0.35
  ratio_consecutive_up_mid: 0.7

  # 动量衰减惩罚
  penalty_momentum_decay_max: 10
  threshold_decay_5d_return: 10.0    # 5 日涨幅 > 此值才检查衰减
  threshold_decay_2d_ratio: 0.2      # 近 2 日涨幅占 5 日涨幅 < 此比例则触发

# 短线回测参数
short_backtest:
  stop_loss_pct: 5.0
  holding_days: [1, 2, 3, 5]
  skip_limit_up_gap: true
  buy_slippage_pct: 0.20    # 买入滑点（A 股 1-3 日短线常见值）
  sell_slippage_pct: 0.20   # 卖出滑点
  commission_pct: 0.025     # 佣金万分之 2.5（_net_return 在买卖两端各扣一次）
  tax_pct: 0.05             # 卖出印花税千分之零点五（2023-08-28 后口径）
